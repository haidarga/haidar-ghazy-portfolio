  <script src="./gsap.min.js"></script>
  <script>
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * clamp(t);
    const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t), 3);
    const easeInOutCubic = (t) => {
      t = clamp(t);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };
    const easeOutBack = (t) => {
      t = clamp(t);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };

    const camera = document.getElementById("camera");
    const haidar = document.getElementById("haidar-char");
    const charHead = document.getElementById("char-head");
    const charEyes = document.getElementById("char-eyes");
    const armPath = document.getElementById("arm-r-path");
    const handR = document.getElementById("hand-r");
    const propAudience = document.getElementById("prop-audience");
    const propIdea = document.getElementById("prop-idea");
    const propScript = document.getElementById("prop-script");
    const thread = document.getElementById("orange-thread");
    const threadTip = document.getElementById("thread-tip");
    const gear1 = document.getElementById("gear-1");
    const gear2 = document.getElementById("gear-2");
    const pipeOut1 = document.getElementById("pipe-out-1");
    const pipeOut2 = document.getElementById("pipe-out-2");
    const pipeOut3 = document.getElementById("pipe-out-3");
    const capEyebrow = document.getElementById("cap-eyebrow");
    const capLine = document.getElementById("cap-line");
    const capBar = document.getElementById("caption-bar");
    const endCard = document.getElementById("end-card");

    const threadLen = thread.getTotalLength();
    const threadPts = Array.from({ length: 201 }, (_, i) => {
      const p = thread.getPointAtLength((i / 200) * threadLen);
      return { x: p.x, y: p.y };
    });
    thread.style.strokeDasharray = threadLen;
    thread.style.strokeDashoffset = threadLen;

    const briefs = [
      ["brief-1", 0.25, 1.35, 920, 320, 740, 620, 610, 990, -34, -8],
      ["brief-2", 0.70, 1.80, 120, 380, 360, 620, 635, 982, 28, 7],
      ["brief-3", 1.15, 2.25, 960, 560, 780, 740, 595, 972, -22, -14],
      ["brief-4", 1.60, 2.70, 540, 260, 580, 620, 622, 962, 32, 10]
    ];

    function bezier(p0, p1, p2, t) {
      const u = 1 - t;
      return u * u * p0 + 2 * u * t * p1 + t * t * p2;
    }

    function renderAt(t) {
      // Dedicated Portrait Vertical Camera Pan & Pullback
      let camY = -200, camScale = 0.94;
      if (t < 4.0) {
        const p = easeInOutCubic(t / 4.0);
        camY = lerp(-240, -180, p);
        camScale = lerp(0.92, 1.04, p);
      } else if (t < 9.0) {
        const p = easeInOutCubic((t - 4.0) / 5.0);
        camY = lerp(-180, -1240, p);
        camScale = lerp(1.04, 1.0, p);
      } else if (t < 11.4) {
        const p = easeInOutCubic((t - 9.0) / 1.2);
        camY = lerp(-1240, -1290, p);
        camScale = lerp(1.0, 1.02, p);
      } else if (t < 13.8) {
        const p = easeInOutCubic((t - 11.4) / 1.0);
        camY = lerp(-1290, -2510, p);
        camScale = 1.02;
      } else if (t < 16.2) {
        const p = easeInOutCubic((t - 13.8) / 1.0);
        camY = lerp(-2510, -3730, p);
        camScale = 1.02;
      } else if (t < 23.0) {
        const p = easeInOutCubic((t - 16.2) / 1.8);
        camY = lerp(-3730, -4960, p);
        camScale = lerp(1.02, 0.96, p);
      } else {
        // Pull back to reveal vertical connected world
        const p = easeInOutCubic((t - 23.0) / 1.6);
        camY = lerp(-4960, -120, p);
        camScale = lerp(0.96, 0.255, p);
      }
      camera.style.transform = `translate3d(0, ${camY.toFixed(1)}px, 0) scale(${camScale.toFixed(4)})`;

      // Briefs
      for (const [id, sT, eT, sx, sy, cx, cy, ex, ey, sR, eR] of briefs) {
        const el = document.getElementById(id);
        const raw = clamp((t - sT) / (eT - sT));
        const p = easeOutCubic(raw);
        const x = bezier(sx, cx, ex, p);
        const y = bezier(sy, cy, ey, p);
        const bounce = raw >= 1 ? Math.sin((t - eT) * 10) * Math.exp(-(t - eT) * 4) * 5 : 0;
        el.setAttribute("transform", `translate(${x.toFixed(1)}, ${(y + bounce).toFixed(1)}) rotate(${lerp(sR, eR, p).toFixed(1)})`);
        el.setAttribute("opacity", raw > 0.02 ? 1 : 0);
      }

      // Character
      const breathY = Math.sin(t * 2.2) * 3;
      const leanX = t < 3.8 ? lerp(0, -12, easeInOutCubic(t / 3.2)) : lerp(-12, 18, clamp((t - 3.8) / 1.2));
      haidar.setAttribute("transform", `translate(${(420 + leanX).toFixed(1)}, ${(800 + breathY).toFixed(1)})`);
      charHead.setAttribute("transform", `translate(0, -18) rotate(${lerp(-4, 9, clamp(t / 3.5)).toFixed(1)})`);
      charEyes.setAttribute("transform", `translate(${lerp(0, 6, clamp(t / 2.5)).toFixed(1)}, 2)`);

      let handRelX = 114, handRelY = 64;
      if (t >= 3.6 && t < 4.5) {
        const p = easeOutBack((t - 3.6) / 0.9);
        handRelX = lerp(114, 178, p);
        handRelY = lerp(64, 104, p);
      } else if (t >= 4.5) {
        handRelX = 135;
        handRelY = 76;
      }
      armPath.setAttribute("d", `M 0 0 Q ${(handRelX * 0.48).toFixed(1)} ${(handRelY * 0.65).toFixed(1)}, ${handRelX.toFixed(1)} ${handRelY.toFixed(1)}`);
      handR.setAttribute("cx", handRelX.toFixed(1));
      handR.setAttribute("cy", handRelY.toFixed(1));

      // Orange thread
      let threadProg = 0;
      if (t >= 4.4 && t < 9.0) threadProg = lerp(0, 0.22, easeInOutCubic((t - 4.4) / 4.6));
      else if (t >= 9.0 && t < 16.2) threadProg = lerp(0.22, 0.74, easeInOutCubic((t - 9.0) / 7.2));
      else if (t >= 16.2 && t < 22.0) threadProg = lerp(0.74, 1.0, easeOutCubic((t - 16.2) / 5.8));
      else if (t >= 22.0) threadProg = 1.0;

      thread.style.strokeDashoffset = (threadLen - threadLen * threadProg).toFixed(1);
      if (threadProg > 0.01 && threadProg < 0.99) {
        const pt = threadPts[Math.min(200, Math.round(threadProg * 200))];
        threadTip.setAttribute("cx", pt.x.toFixed(1));
        threadTip.setAttribute("cy", pt.y.toFixed(1));
        threadTip.setAttribute("opacity", "1");
      } else {
        threadTip.setAttribute("opacity", "0");
      }

      // Organize Desk Cards
      const pA = easeOutBack(clamp((t - 5.0) / 0.6));
      propAudience.setAttribute("transform", `translate(260, ${lerp(1270, 1250, pA).toFixed(1)}) rotate(${lerp(-14, 0, pA).toFixed(1)})`);
      const pI = easeOutBack(clamp((t - 5.8) / 0.6));
      propIdea.setAttribute("transform", `translate(540, ${lerp(1300, 1270, pI).toFixed(1)}) rotate(${lerp(16, 0, pI).toFixed(1)})`);
      const pS = easeOutBack(clamp((t - 6.6) / 0.6));
      propScript.setAttribute("transform", `translate(820, ${lerp(1270, 1250, pS).toFixed(1)}) rotate(${lerp(-12, 0, pS).toFixed(1)})`);

      // Studio gears & outputs
      const sT = clamp((t - 16.5) / 5.5);
      gear1.setAttribute("transform", `translate(220, 50) rotate(${(sT * 360).toFixed(1)})`);
      gear2.setAttribute("transform", `translate(560, 50) rotate(${(-sT * 420).toFixed(1)})`);
      pipeOut1.setAttribute("transform", `translate(${lerp(300, 620, easeOutBack(clamp((t - 18.2) / 1.4))).toFixed(1)}, 34)`);
      pipeOut1.setAttribute("opacity", clamp((t - 18.2) / 0.3));
      pipeOut2.setAttribute("transform", `translate(${lerp(300, 700, easeOutBack(clamp((t - 18.9) / 1.4))).toFixed(1)}, 34)`);
      pipeOut2.setAttribute("opacity", clamp((t - 18.9) / 0.3));
      pipeOut3.setAttribute("transform", `translate(${lerp(300, 780, easeOutBack(clamp((t - 19.6) / 1.4))).toFixed(1)}, 34)`);
      pipeOut3.setAttribute("opacity", clamp((t - 19.6) / 0.3));

      // Captions
      if (t < 4.0) {
        capEyebrow.textContent = "01 · THE BRIEF STORM";
        capLine.innerHTML = "Different brands.<br />Different problems.";
        capBar.style.opacity = clamp(t / 0.5);
      } else if (t < 9.0) {
        capEyebrow.textContent = "02 · FINDING THE CONNECTION";
        capLine.innerHTML = "Find the audience.<br />Shape the idea.";
        capBar.style.opacity = 1;
      } else if (t < 16.2) {
        capEyebrow.textContent = "03 · CREATIVE WORLDS";
        capLine.innerHTML = "Different stories.<br />Different worlds.";
        capBar.style.opacity = 1;
      } else if (t < 23.0) {
        capEyebrow.textContent = "04 · PRODUCTION SYSTEMS";
        capLine.innerHTML = "Build a better way<br />to create.";
        capBar.style.opacity = 1;
      } else {
        capEyebrow.textContent = "05 · ONE CONNECTED WORLD";
        capLine.innerHTML = "From signal to story<br />to system.";
        capBar.style.opacity = clamp(1 - (t - 25.0) / 0.7);
      }

      endCard.style.opacity = clamp((t - 25.8) / 0.9);
    }

    renderAt(0);
    const state = { t: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.to(state, { t: 30, duration: 30, ease: "none", onUpdate: () => renderAt(state.t) }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
